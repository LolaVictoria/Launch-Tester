# flawed-shop uses 8080, so this runner uses 8081
server.port=8081

# Safety guard: the runner only tests these hosts. Only test apps you own.
launchcheck.allowed-hosts=localhost,127.0.0.1

# Rules for the breaking-point finder
launchcheck.p95-limit-ms=20
launchcheck.max-failed-percent=1.0
launchcheck.degrade-factor=3.0
